<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Customer</title>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow max-auto" style="max-width: 500px;">
            <div class="card-header bg-danger text-white text-center">
                <h3> Delete Customer</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <label class="form-label">
                        Account Number
                    </label>
                    <input type="text" name="account_no" class="form-control mb-3 "
                    placeholder="Enter account number" required>
                    <button type="submit" class="btn btn-danger w-100">Delete Customer</button>
                </form>
                <a href="/dashboard" class="btn btn-secondary w-100 mt-2">Back to Dashboard</a>
            </div>
        </div>
    </div>
    
</body>
</html>

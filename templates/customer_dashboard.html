<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-header bg-success text-white text-center">
            <h4 class="mb-0">Customer Dashboard</h4>
        </div>

        <div class="card-body">

            <h5>Welcome, {{ customer.full_name }}</h5>

            <hr>

            <p><strong>Account No:</strong> {{ customer.account_no }}</p>

            <p><strong>Email:</strong> {{ customer.email }}</p>

            <p><strong>Mobile:</strong> {{ customer.mobile }}</p>

            <p><strong>Address:</strong> {{ customer.address }}</p>

            <p><strong>Balance:</strong> ₹{{ customer.balance }}</p>

            <a href="/logout" class="btn btn-danger w-100 mt-3">
                Logout
            </a>

        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANK Sign-up</title>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>
<body class="login-page">
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <div class="login-box shodow-lg">

            <div class="login-left">
                <div class="bank-logo">
                    🏦
                </div>
                <h1>NOVA BANK</h1>
                <h3>Banking Made Simple.</h3>
                <p>Create your account and manage your banking information securely form 
                    one powerful plateform
                </p>
                <div class="security-box">
                    🔒 Secure & Reliable Banking
                </div>
            </div>
            <div class="login-right">
                <h2>Create Account</h2>
                <p class="login-subtitle">
                    Create your NOVA BANK account
                </p>
                <form action="/signup" method="POST">
                    <div class="mb-3">
                        <label class="form-lable">Full Name</label>
                        <input type="text" class="form-control" name="full_name" placeholder="Enter your full name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-lable">Username</label>
                        <input type="text" class="form-control" name="username" placeholder=" Create a username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-lable">Email Address </label>
                        <input type="text" class="form-control" name="email" placeholder="Enter your email id" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-lable">Mobile Number</label>
                        <input type="tel" class="form-control" name="mobile" placeholder="Enter your mobile number" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-lable">Password</label>
                        <input type="password"  name="password" class="form-control" placeholder="Create a password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-lable">Confirm Password</label>
                        <input type="password"  name="confirm_password" class="form-control" placeholder="Confirm your password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-lable">Address</label>
                        <textarea class="form-control" name="address" rows="2" placeholder="Enter yuor address" required></textarea>
                    </div>
                    <button type="submit" class="btn login-button w-100 btn btn-success">Create Account</button>
                </form>
                <div class="Signup-text">Already have an account ?
                    <a href="/login">Login</a>
                </div>
                <div class="login-footer">🔐 Your information is protected
                     </div>
            </div>
        </div>
</div>
</body>
</html>

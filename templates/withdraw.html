<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=`, initial-scale=1.0">
    <title>Withdraw money</title>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark text-center">
                       <h3>Withdraw Money</h3>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="/withdrw">
                            <div class="mb-3">
                                <label class="form-label">Account Number</label>
                                <input type="number" name="account_no" class="form-control"
                                placeholder="Enter your account no" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Amount</label>
                                <input type="number" name="amount" class="form-control"
                                placeholder="Enter amount" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100">Withdraw</button>

                        </form>
                        <a href="/dashboard" class="btn btn-secondary w-100 mt-3" >Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
